[project]
name = "diffmechint"
version = "0.1.0"
description = "Mechanistic atlas of tokenizer interventions in latent diffusion."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Luca Cerovaz", email = "luca.cerovaz@paradigma.inc" },
    { name = "Michele Mancusi" },
    { name = "Giorgio Strano" },
]
dependencies = [
    "torch>=2.5,<2.7",
    "torchvision",
    "diffusers>=0.30",
    "transformers>=4.45",
    "accelerate>=1.0",
    "lightning>=2.4",
    "hydra-core>=1.3",
    "omegaconf",
    "timm",
    "torchdiffeq",
    "huggingface-hub",
    "safetensors",
    "h5py",
    "einops",
    "rich",
    "wandb",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "numpy",
    "pillow",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
]
mechint = [
    "nnsight>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffmechint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[tool.mypy]
python_version = "3.11"
strict = false
files = ["src/diffmechint"]

[[tool.mypy.overrides]]
module = ["src.diffmechint.tokenizers.*", "src.diffmechint.sae.*"]
strict = true
