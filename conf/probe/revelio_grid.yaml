# Revelio-style probe grid: per (layer, t_bin) cell train one logistic-regression
# probe per concept axis. Reads activation HDF5s produced by Phase 3.

# Concept axes — all 6 listed run on the existing K=3 production grid
# without any extra labelling pass. `scene` / `color` / `texture` / `shape`
# in concepts.py need a CLIP-zero-shot labelling pass and are off by default.
concepts:
  - object
  - animal_binary
  - broad_8
  - vehicle_binary
  - food_binary
  - instrument_binary

# Sweep grid (matches `default_tap_layers` for SiT-B).
layers: [3, 6, 9]
t_bins: [0, 1, 2]            # bin indices: 0=t≈0.025, 1=t≈0.20, 2=t≈0.50

# Token pooling — Revelio uses per-token training; "mean" is the alternative.
pool: tokens

# Probe hyperparameters.
max_samples: 50000
test_size: 0.2
max_iter: 1000
C: 1.0
seed: 42
