# Top-level Hydra config — composed at runtime via `hydra.main` decorators.
# Sub-configs select via CLI overrides, e.g.:
#   uv run python -m diffmechint.training.precompute_latents tokenizer=eq_vae

defaults:
  - tokenizer: sd_vae
  - model: sit_b_2
  - transport: fm_ot
  - trainer: local_3090
  - callbacks: none
  - _self_

# Output root: locally is a project subdirectory; on CINECA an env var override
# points this at $FAST/diffmechint/outputs/.
output_root: ${oc.env:DIFFMECHINT_OUTPUT_ROOT,${hydra:runtime.cwd}/outputs}

# HF cache also redirected to $FAST on CINECA.
hf_cache: ${oc.env:HF_HOME,${hydra:runtime.cwd}/hf_cache}

# Reproducibility default; per-condition runs override.
seed: 42

# Hydra runtime layout — every job gets its own dated dir under output_root/runs/.
hydra:
  run:
    dir: ${output_root}/runs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_root}/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
