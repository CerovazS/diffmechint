# 2× A100 64GB on CINECA Leonardo (boost_usr_prod). DDP across both.
# Lightning auto-selects strategy=ddp when devices>1. Batch in datamodule is
# per-GPU; with batch_size=128 → global batch = 256 (4× PLAN baseline of 128).
# val every ~1 epoch (4754 step) on a 20-batch random subset → ~60s overhead.
max_steps: 200000
devices: 2
precision: bf16-mixed
gradient_clip_val: 1.0
# `val_check_interval` is interpreted as a global-step count (not per-epoch
# batch index) because we set `check_val_every_n_epoch=null`. Required since
# `val_check_interval=5000 > 4754 batch/epoch` would otherwise raise.
val_check_interval: 5000
check_val_every_n_epoch: null
limit_val_batches: 20
