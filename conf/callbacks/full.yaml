# Full Tier 1 + Tier 2: sample callback every 5k step + mini-FID every 25k step.
sample:
  _target_: diffmechint.training.callbacks.SampleCallback
  every_n_steps: 5000
  n_samples: 16
  cfg_scales: [1.0, 4.0]
  sample_steps: 50
  sample_method: dopri5
  out_subdir: samples
  adapter_name: ???
  num_classes: 1000
  stats_path: ???
  seed: 0
fid:
  _target_: diffmechint.training.callbacks.MiniFIDCallback
  every_n_steps: 25000
  # 5000 samples to stay comparable with scripts/eval/post_hoc_fid.py (same default).
  # Per call ~5-8 min on 1× A100; pair with NCCL_TIMEOUT_MS=3600000 in the sbatch
  # wrapper so the DDP rank > 0 barrier doesn't time out at the default 30 min.
  n_samples: 5000
  sample_batch_size: 32
  # SiT/REPA-E published recipe: SDE Euler-Maruyama 250 steps + CFG=1.5.
  cfg_scale: 1.5
  sample_steps: 250
  sampler_kind: sde
  reference_dir: /leonardo_scratch/fast/IscrC_YENDRI/imagenet/val
  reference_name: imagenet_val_50k
  adapter_name: ???
  num_classes: 1000
  stats_path: ???
  seed: 0
  # Refuse to start training if cleanfid cache isn't built.
  require_cache_at_init: true
