# SiT-B/1: same depth/width as SiT-B/2 but patch_size=1.
# Use for tokenizers with small spatial latents (e.g. DC-AE 1.0 → 8×8 → 64 patches
# instead of 16) to give the DiT enough token capacity.
_target_: diffmechint.training.sit_module.SiTLightningModule
model_name: SiT-B/1
num_classes: 1000
class_dropout_prob: 0.1
learn_sigma: true
lr: 1.0e-4
weight_decay: 0.0
betas: [0.9, 0.999]
warmup_steps: 10000
ema_decay: 0.9999
